<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Developer Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'brand-green': '#B8D896',
              'brand-pink': '#FFC5D0',
              'brand-blue': '#BFE3E8',
              'brand-cream': '#FDFBF7',
              'brand-dark': '#1a1a1a',
            },
            fontFamily: {
              sans: ['Pretendard', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            backgroundImage: {
              'grid-pattern': "linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px)",
              'grid-pattern-dark': "linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px)",
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #B8D896;
        background-image: linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        font-family: 'Pretendard', sans-serif;
        color: #1a1a1a;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Dark Mode Styles applied via body class or html class */
      html.dark body {
        background-color: #1a1a1a;
        background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
        color: #FDFBF7;
      }

      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .marquee-container {
        overflow: hidden;
        white-space: nowrap;
      }
      .marquee-content {
        display: inline-block;
        animation: marquee 20s linear infinite;
      }
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      /* Custom card shadow for that pop/sticker look */
      .pop-shadow {
        box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
      }
      html.dark .pop-shadow {
        box-shadow: 4px 4px 0px 0px #B8D896; /* Light green shadow in dark mode */
      }

      .pop-shadow-hover:hover {
        box-shadow: 6px 6px 0px 0px rgba(0,0,0,1);
        transform: translate(-2px, -2px);
      }
      
      .pop-shadow-sm {
        box-shadow: 2px 2px 0px 0px rgba(0,0,0,1);
      }
      html.dark .pop-shadow-sm {
        box-shadow: 2px 2px 0px 0px #B8D896;
      }
      
      /* Custom scrollbar for modal */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #888; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555; 
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
